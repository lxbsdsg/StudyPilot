[package]
name = "studypilot-core"
version = "0.1.0"
edition = "2024"
description = "StudyPilot domain, persistence, and platform adapters"

[lib]
name = "studypilot_core"
path = "src/lib.rs"

[[bin]]
name = "studypilot-server-v2"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.3"
headless_chrome = "1.0"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "cookies", "gzip", "http2", "query", "rustls", "system-proxy"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(windows))'.dependencies]
aes-gcm = "0.10"

[dev-dependencies]
futures = "0.3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
